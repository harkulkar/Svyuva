# Example local/staging compose. Do not put production secrets in this file.
# Copy .env.example to .env and fill values. Hosting provider: TODO: CONFIGURE

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "8080:80"
    depends_on:
      - api
